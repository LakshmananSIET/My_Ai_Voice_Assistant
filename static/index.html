<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jannu - My AI Voice Assistant</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/static/style.css?v=20261003-3">
</head>
<body>
<div class="app-container">
<header class="call-header">
  <div class="call-top">
    <span class="call-back">Jannu</span>
    <span class="online-dot"></span><span class="online-text">Online</span>
  </div>
  <div class="jannu-avatar" aria-label="Jannu">
    <div class="avatar-face">👩🏻</div>
    <div class="voice-ring ring-one"></div>
    <div class="voice-ring ring-two"></div>
  </div>
  <h1>Jannu</h1>
  <p id="status" class="status">Mic start pannunga</p>
  <button id="micBtn" class="call-btn" aria-label="Start speaking">
    <span class="call-icon">🎙️</span>
  </button>
  <div class="call-hint">Tap to speak with Jannu</div>
</header>
<main id="chatBox" class="chat-box compact-chat"><div class="message ai">Hi Lakshman sir! Enna help venum?</div></main>
<button id="moreBtn" class="more-btn" type="button">⌄ Show Activity, Reminders & Tasks</button>
<div id="detailsPanel" class="details-panel">
<section class="activity-panel">
  <div class="section-title"><h2>📋 Jannu Activity</h2><span id="activityCount">0</span></div>
  <div id="activityList" class="activity-list"><div class="empty">No activity yet</div></div>
</section>
<section class="panel"><h3>🔔 Reminders <span id="reminderCount">0</span></h3><ul id="remindersList" class="item-list"><li class="empty">No reminders</li></ul></section>
<section class="panel"><h3>✅ Tasks <span id="taskCount">0</span></h3><ul id="tasksList" class="item-list"><li class="empty">No tasks</li></ul></section>
<section class="panel notes-panel">
  <h3>📝 Notes</h3>
  <ul id="notesList" class="item-list"><li class="empty">No notes</li></ul>
</section>
</div>
<footer>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
<button id="cameraBtn" class="action-btn camera" aria-label="Camera">📷</button>
</footer>
</div>
<script src="/static/app.js?v=20261003-3"></script>
</body>
</html>
